<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Samaritan</title>
    <meta name="description" content="Real-time player tracking and path history for EarthMC Minecraft server." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: #0e0e12;
            color: #e2e2e2;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            background: #1a1a1a;
        }

        .leaflet-tile {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* ===================== BANNERS ===================== */
        #loading-banner, #error-banner {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 22px;
            border-radius: 8px;
            z-index: 2000;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.6);
            display: none;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        #loading-banner { background: rgba(255,204,0,0.9); color: #1a1200; }
        #error-banner   { background: rgba(220,53,69,0.9);  color: #fff; }

        /* ===================== SEARCH BOX ===================== */
        #search-container {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 1500;
        }

        #search-box {
            background: rgba(18,18,28,0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 12px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            display: flex;
            gap: 8px;
            align-items: center;
            position: relative; /* autocomplete anchors to this */
        }

        #search-box input {
            padding: 8px 12px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            outline: none;
            width: 180px;
            transition: border-color 0.2s;
        }
        #search-box input:focus { border-color: #f5c518; }

        .btn {
            padding: 8px 14px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.18s ease;
            white-space: nowrap;
        }
        .btn-locate {
            background: linear-gradient(135deg, #f5c518, #e6a800);
            color: #111;
        }
        .btn-locate:hover { background: linear-gradient(135deg, #ffe066, #f5c518); transform: translateY(-1px); }

        .btn-track {
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            color: #fff;
        }
        .btn-track:hover { background: linear-gradient(135deg, #9d55ff, #7c3aed); transform: translateY(-1px); }

        .btn-list {
            background: linear-gradient(135deg, #0ea5e9, #0369a1);
            color: #fff;
        }
        .btn-list:hover { background: linear-gradient(135deg, #38bdf8, #0ea5e9); transform: translateY(-1px); }

        .btn-sm {
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 6px;
        }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; }
        .btn-danger:hover { background: linear-gradient(135deg, #f87171, #ef4444); }
        .btn-eye { background: rgba(255,255,255,0.1); color: #ccc; }
        .btn-eye:hover { background: rgba(255,255,255,0.18); }
        .btn-eye.active { background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; }

        .auto-track-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #aaa;
            font-size: 12px;
            white-space: nowrap;
            user-select: none;
            cursor: pointer;
        }
        .auto-track-label input[type=checkbox] { accent-color: #f5c518; cursor: pointer; }

        /* ===================== AUTOCOMPLETE ===================== */
        #autocomplete-list {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(18,18,28,0.96);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 2000;
        }
        .autocomplete-item {
            padding: 8px 12px;
            color: #ddd;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 13px;
            transition: background 0.15s;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover { background: rgba(255,255,255,0.07); }
        .autocomplete-item img { width: 22px; height: 22px; image-rendering: pixelated; border-radius: 3px; }

        /* ===================== TRACKER PANEL ===================== */
        #tracker-panel {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 1500;
            width: 310px;
            background: rgba(12,12,20,0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.65);
            display: none;
            flex-direction: column;
            overflow: hidden;
            max-height: calc(100vh - 36px);
        }

        #tracker-panel-header {
            padding: 14px 16px;
            background: rgba(124,58,237,0.18);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #tracker-panel-header h3 {
            font-size: 14px;
            font-weight: 700;
            color: #c4b5fd;
            letter-spacing: 0.04em;
        }
        #tracker-count-badge {
            background: #7c3aed;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
        }

        #tracker-list-body {
            overflow-y: auto;
            flex: 1;
            padding: 8px 0;
        }
        #tracker-list-body::-webkit-scrollbar { width: 4px; }
        #tracker-list-body::-webkit-scrollbar-track { background: transparent; }
        #tracker-list-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .tracker-item {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }
        .tracker-item:last-child { border-bottom: none; }
        .tracker-item:hover { background: rgba(255,255,255,0.04); }
        .tracker-item.active { background: rgba(124,58,237,0.12); border-left: 3px solid #7c3aed; }

        .tracker-item-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .tracker-item-top img {
            width: 28px;
            height: 28px;
            image-rendering: pixelated;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .tracker-item-name {
            font-size: 13px;
            font-weight: 600;
            color: #e2e2e2;
            flex: 1;
        }
        .tracker-item-btns {
            display: flex;
            gap: 5px;
        }
        .tracker-item-meta {
            font-size: 10px;
            color: #666;
            padding-left: 38px;
            line-height: 1.6;
        }
        .tracker-item-meta span.online  { color: #4ade80; }
        .tracker-item-meta span.offline { color: #f87171; }

        #tracker-empty {
            padding: 30px 14px;
            text-align: center;
            color: #555;
            font-size: 13px;
            line-height: 1.7;
        }

        /* ===================== PATH SLIDER PANEL ===================== */
        #path-slider-panel {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1500;
            width: min(680px, calc(100vw - 36px));
            background: rgba(12,12,20,0.92);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.7);
            padding: 16px 20px 18px;
            display: none;
        }

        #path-slider-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        #path-player-avatar {
            width: 32px; height: 32px;
            image-rendering: pixelated;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.14);
        }
        #path-player-name {
            font-size: 15px;
            font-weight: 700;
            color: #e2e2e2;
            flex: 1;
        }
        #path-point-count {
            font-size: 11px;
            color: #666;
        }
        #path-close-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 6px;
            transition: color 0.15s, background 0.15s;
        }
        #path-close-btn:hover { color: #f87171; background: rgba(248,113,113,0.1); }

        #path-time-range-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .time-label {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
        }
        .time-value {
            font-size: 11px;
            color: #c4b5fd;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Dual-handle slider */
        .range-slider-wrap {
            flex: 1;
            position: relative;
            height: 20px;
            min-width: 200px;
        }
        .range-slider-wrap input[type=range] {
            position: absolute;
            left: 0; right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            pointer-events: none;
            height: 4px;
        }
        .range-slider-wrap input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px; height: 16px;
            border-radius: 50%;
            background: #7c3aed;
            border: 2px solid #c4b5fd;
            pointer-events: all;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(124,58,237,0.5);
            transition: transform 0.15s;
        }
        .range-slider-wrap input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.25); }
        .range-slider-track {
            position: absolute;
            top: 50%; left: 0; right: 0;
            transform: translateY(-50%);
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            pointer-events: none;
        }
        .range-slider-fill {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            height: 4px;
            background: linear-gradient(90deg, #7c3aed, #c4b5fd);
            border-radius: 4px;
            pointer-events: none;
        }

        #path-stats-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .path-stat {
            font-size: 11px;
            color: #666;
        }
        .path-stat strong { color: #c4b5fd; }
    </style>
</head>
<body>
    <div id="loading-banner">Checking map tile status…</div>
    <div id="error-banner"></div>

    <!-- Search bar (top-right) -->
    <div id="search-container">
        <div id="search-box">
            <input type="text" id="username-input"
                   placeholder="Search player…"
                   onkeydown="if(event.key==='Enter'){searchPlayer();}" />
            <button class="btn btn-locate" onclick="searchPlayer()" id="locate-btn">Locate</button>
            <button class="btn btn-track"  onclick="trackPlayer()"  id="track-btn">Track</button>
            <button class="btn btn-list"   onclick="toggleTrackerPanel()" id="list-btn">&#9776; List</button>
            <label class="auto-track-label">
                <input type="checkbox" id="auto-track-toggle" />
                Follow
            </label>
            <div id="autocomplete-list"></div>
        </div>
    </div>

    <!-- Tracker panel (top-left) -->
    <div id="tracker-panel">
        <div id="tracker-panel-header">
            <h3>&#127919; TRACKING</h3>
            <span id="tracker-count-badge">0</span>
        </div>
        <div id="tracker-list-body">
            <div id="tracker-empty">No players being tracked.<br/>Search for a name and click <strong>Track</strong>.</div>
        </div>
    </div>

    <!-- Path time-slider panel (bottom-centre) -->
    <div id="path-slider-panel">
        <div id="path-slider-header">
            <img id="path-player-avatar" src="" alt="avatar" />
            <span id="path-player-name">&#8212;</span>
            <span id="path-point-count"></span>
            <button id="path-close-btn" onclick="closePathPanel()" title="Close">&#10005;</button>
        </div>

        <div id="path-time-range-row">
            <span class="time-label">From</span>
            <span class="time-value" id="range-start-label">&#8212;</span>
            <div class="range-slider-wrap" id="slider-wrap">
                <div class="range-slider-track"></div>
                <div class="range-slider-fill" id="slider-fill"></div>
                <input type="range" id="range-start" min="0" max="100" value="0" step="1" />
                <input type="range" id="range-end"   min="0" max="100" value="100" step="1" />
            </div>
            <span class="time-label">To</span>
            <span class="time-value" id="range-end-label">&#8212;</span>
        </div>

        <div id="path-stats-row">
            <div class="path-stat">Points in view: <strong id="stat-visible">0</strong></div>
            <div class="path-stat">Total distance: <strong id="stat-distance">0</strong> blocks</div>
            <div class="path-stat">Duration: <strong id="stat-duration">&#8212;</strong></div>
        </div>
    </div>

    <div id="map"></div>

    <script>
    // =====================================================================
    // CONFIG
    // =====================================================================
    const apikey = "I9DYCLxy0Mjr16gwg2EDoQ";
    const REFRESH_MS = 3000;

    const TRACK_COLOURS = [
        "#c4b5fd", "#f472b6", "#34d399", "#fbbf24",
        "#60a5fa", "#f87171", "#a3e635", "#fb923c"
    ];

    // Player data goes into HTML, so escape it
    function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function(c) {
            return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
        });
    }

    function headUrl(name, size) {
        return 'https://minotar.net/helm/' + encodeURIComponent(name) + '/' + size + '.png';
    }

    // =====================================================================
    // MAP SETUP
    // =====================================================================
    var map = L.map('map', {
        crs: L.extend({}, L.CRS.Simple, {
            transformation: new L.Transformation(1/32, 0, 1/32, 0)
        }),
        center: [9992, 53191],
        zoom: 7,
        minZoom: 0,
        maxZoom: 7,
        attributionControl: false
    });

    // Which map snapshot to show. null = the live tiles server.py downloads into tiles/minecraft_overworld
    var snapshotid = null;

    L.TileLayer.Squaremap = L.TileLayer.extend({
        getTileUrl: function(coords) {
            var zoom = this._getZoomForUrl();
            if (snapshotid === null) {
                return '/tiles/minecraft_overworld/' + zoom + '/' + coords.x + '_' + coords.y + '.png';
            }
            return '/map/gettiles?apikey=' + apikey + '&snapshotid=' + snapshotid + '&zoomlevel=' + zoom + '&tile=' + coords.x + '_' + coords.y;
        }
    });

    var earthmcLayer = new L.TileLayer.Squaremap('', {
        tileSize: 512,
        minNativeZoom: 0,
        maxNativeZoom: 5,
        maxZoom: 7,
        noWrap: true,
        keepBuffer: 9999,
        updateWhenZooming: false,
        errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='
    });

    // Use the newest finished snapshot whose tiles are on this computer, otherwise the live tiles
    fetch('/map/getsnapshots', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ apikey: apikey })
    })
        .then(function(r) { return r.json(); })
        .then(function(snapshots) {
            var latest = Array.isArray(snapshots) ? snapshots.find(function(s) { return s.completed && s.available; }) : null;
            if (latest) snapshotid = latest.id;
        })
        .catch(function(err) { console.error("Error fetching map snapshots, using live tiles:", err); })
        .finally(function() { earthmcLayer.addTo(map); });

    // =====================================================================
    // BANNERS
    // =====================================================================
    function showWarning(msg, durationMs) {
        if (!durationMs) durationMs = 6000;
        const b = document.getElementById('error-banner');
        b.textContent = msg;
        b.style.display = 'block';
        clearTimeout(b._timer);
        b._timer = setTimeout(function() { b.style.display = 'none'; }, durationMs);
    }

    // =====================================================================
    // LIVE PLAYERS
    // =====================================================================
    var playerLayer = L.layerGroup().addTo(map);
    window.livePlayers = [];
    var playerMarkers = {}; // by uuid
    var playersFailing = false;
    var trackedUsername = "";
    var autoTrackEnabled = false;

    function centerOnTrackedPlayer(players) {
        if (!autoTrackEnabled || !trackedUsername) return;
        var match = null;
        for (var i = 0; i < players.length; i++) {
            if (players[i].name && players[i].name.toLowerCase() === trackedUsername.toLowerCase()) {
                match = players[i]; break;
            }
        }
        if (match) map.setView([match.z, match.x], 6);
    }

    function playerPopup(player) {
        return '<div style="color:#111;min-width:150px;">' +
            '<div style="font-weight:bold;border-bottom:1px solid #ccc;padding-bottom:3px;margin-bottom:3px;">' + escapeHtml(player.name) + '</div>' +
            '<table style="font-size:12px;width:100%;">' +
            '<tr><td style="padding-right:10px;font-weight:bold;">x</td><td>' + escapeHtml(player.x) + '</td></tr>' +
            '<tr><td style="padding-right:10px;font-weight:bold;">y</td><td>' + escapeHtml(player.y) + '</td></tr>' +
            '<tr><td style="padding-right:10px;font-weight:bold;">z</td><td>' + escapeHtml(player.z) + '</td></tr>' +
            '</table></div>';
    }

    function playerIcon(player) {
        var name = escapeHtml(player.name);
        return L.divIcon({
            className: 'player-custom-icon',
            html: '<div style="display:flex;align-items:center;white-space:nowrap;transform:translate(-50%,-50%);cursor:pointer;">' +
                '<div style="width:16px;height:16px;border:1px solid #000;background:#000;">' +
                '<img src="' + headUrl(player.name, 16) + '" style="width:16px;height:16px;image-rendering:pixelated;display:block;" />' +
                '</div>' +
                '<div style="background:rgba(0,0,0,0.6);margin-left:2px;padding:2px 5px;border-radius:2px;border:1px solid #000;">' +
                '<span style="color:#fff;font-size:13px;font-family:Inter,sans-serif;font-weight:bold;text-shadow:1px 1px 0 #000;">' + name + '</span>' +
                '</div></div>',
            iconSize: [0,0], iconAnchor: [0,0]
        });
    }

    function drawPlayers(players) {
        window.livePlayers = players;
        var current = {};

        players.forEach(function(player) {
            // Players hidden from the map have no coordinates
            if (player.x === null || player.z === null) return;
            current[player.uuid] = true;
            var latlng = [player.z, player.x];

            if (playerMarkers[player.uuid]) {
                playerMarkers[player.uuid].setLatLng(latlng);
                playerMarkers[player.uuid].getPopup().setContent(playerPopup(player));
            } else {
                var marker = L.marker(latlng, {icon: playerIcon(player), zIndexOffset: 1000}).bindPopup(playerPopup(player), {offset:[0,-10]});
                marker.addTo(playerLayer);
                playerMarkers[player.uuid] = marker;
            }
        });

        for (var uuid in playerMarkers) {
            if (!current[uuid]) {
                playerLayer.removeLayer(playerMarkers[uuid]);
                delete playerMarkers[uuid];
            }
        }
        centerOnTrackedPlayer(players);
    }

    function updatePlayers() {
        var live = fetch('/players/liveplayers')
            .then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function(players) {
                playersFailing = false;
                drawPlayers(players);
            })
            .catch(function(err) {
                console.error("Live players error:", err);
                // Only warn once per outage, not every refresh
                if (!playersFailing) showWarning("Couldn't load live players, retrying...");
                playersFailing = true;
            });

        // Snapshot tracked players every cycle (the server ignores calls closer than 3s apart)
        var tracked = fetch('/players/snapshottracked', { method: 'POST' }).catch(function(){});

        // Refresh tracker list
        if (trackerPanelOpen) refreshTrackerPanel();

        // Wait for this refresh to finish before scheduling the next, so slow requests can't pile up
        Promise.all([live, tracked]).finally(function() { setTimeout(updatePlayers, REFRESH_MS); });
    }

    // =====================================================================
    // SEARCH / LOCATE
    // =====================================================================
    function focusPlayer(player) {
        map.setView([player.z, player.x], 6);
        var marker = playerMarkers[player.uuid];
        if (marker) marker.openPopup();
    }

    function locatePlayer(username, panMap) {
        // Players already on the map don't need a server round trip
        var onmap = window.livePlayers.find(function(p) {
            return p.name && p.name.toLowerCase() === username.toLowerCase() && p.x !== null;
        });
        if (onmap) {
            if (panMap) focusPlayer(onmap);
            return Promise.resolve(true);
        }

        return fetch('/players/search?username=' + encodeURIComponent(username))
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) { showWarning(data.error); return false; }
                if (panMap) focusPlayer(data);
                return true;
            })
            .catch(function() { showWarning("Search failed, is the server running?"); return false; });
    }

    function stopAutoTrack() { autoTrackEnabled = false; trackedUsername = ""; }
    function startAutoTrack(u) { autoTrackEnabled = true; trackedUsername = u; }

    function searchPlayer() {
        var inp = document.getElementById("username-input");
        var u = inp.value.trim();
        if (!u) return;
        inp.disabled = true;
        locatePlayer(u, true).then(function(ok) {
            inp.disabled = false;
            var tog = document.getElementById("auto-track-toggle");
            if (ok && tog.checked) startAutoTrack(u);
            else stopAutoTrack();
        });
    }

    // =====================================================================
    // TRACKER PANEL
    // =====================================================================
    var trackerPanelOpen = false;
    var trackedPlayers = [];
    var colourMap = {};
    var colourIndex = 0;

    function getColour(uuid) {
        if (!colourMap[uuid]) {
            colourMap[uuid] = TRACK_COLOURS[colourIndex % TRACK_COLOURS.length];
            colourIndex++;
        }
        return colourMap[uuid];
    }

    function toggleTrackerPanel() {
        trackerPanelOpen = !trackerPanelOpen;
        document.getElementById('tracker-panel').style.display = trackerPanelOpen ? 'flex' : 'none';
        if (trackerPanelOpen) refreshTrackerPanel();
    }

    function trackPlayer() {
        var u = document.getElementById("username-input").value.trim();
        if (!u) { showWarning("Type a player name first."); return; }

        var btn = document.getElementById("track-btn");
        btn.disabled = true;
        btn.textContent = "…";

        fetch('/players/starttrack', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: u })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.error) { showWarning(data.error); return; }
            if (!trackerPanelOpen) toggleTrackerPanel();
            else refreshTrackerPanel();
        })
        .catch(function(e) { showWarning("Failed to start tracking: " + e); })
        .finally(function() { btn.disabled = false; btn.textContent = "Track"; });
    }

    function stopTracking(uuid) {
        fetch('/players/stoptrack', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({uuid: uuid})
        }).then(function() {
            if (pathLayers[uuid]) {
                pathLayers[uuid].remove();
                delete pathLayers[uuid];
            }
            if (selectedPathUUID === uuid) closePathPanel();
            refreshTrackerPanel();
        });
    }

    function trackerItem(tp) {
        var colour = getColour(tp.uuid);
        var latest = tp.latest;
        var isOnline = latest && latest.isOnline;
        var started = new Date(tp.started_at * 1000).toLocaleString();
        var lastSeen = latest ? new Date(latest.timestamp * 1000).toLocaleTimeString() : '—';
        var coords = latest && latest.x !== null ? (latest.x + ', ' + latest.y + ', ' + latest.z) : '—';
        var isSelected = selectedPathUUID === tp.uuid;

        var item = document.createElement('div');
        item.className = 'tracker-item' + (isSelected ? ' active' : '');
        item.dataset.uuid = tp.uuid;

        item.innerHTML =
            '<div class="tracker-item-top">' +
                '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + colour + ';flex-shrink:0;"></span>' +
                '<img src="' + headUrl(tp.username, 28) + '" alt="' + escapeHtml(tp.username) + '" />' +
                '<span class="tracker-item-name">' + escapeHtml(tp.username) + '</span>' +
                '<div class="tracker-item-btns">' +
                    '<button class="btn btn-sm btn-eye' + (isSelected ? ' active' : '') + '" title="Show path">&#9711;</button>' +
                    '<button class="btn btn-sm btn-danger" title="Stop tracking">&#10005;</button>' +
                '</div>' +
            '</div>' +
            '<div class="tracker-item-meta">' +
                'Status: <span class="' + (isOnline ? 'online' : 'offline') + '">' + (isOnline ? 'Online' : 'Offline') + '</span>' +
                ' &nbsp;|&nbsp; Coords: ' + escapeHtml(coords) + '<br/>' +
                'Last seen: ' + escapeHtml(lastSeen) + ' &nbsp;|&nbsp; Since: ' + escapeHtml(started) +
            '</div>';

        item.querySelector('.btn-eye').addEventListener('click', function() { selectPath(tp.uuid, tp.username); });
        item.querySelector('.btn-danger').addEventListener('click', function() { stopTracking(tp.uuid); });

        // Click on row (not buttons) -> pan to player
        item.querySelector('.tracker-item-top').addEventListener('click', function(e) {
            if (e.target.closest('.tracker-item-btns')) return;
            if (tp.latest && tp.latest.x !== null) map.setView([tp.latest.z, tp.latest.x], 6);
        });
        return item;
    }

    function refreshTrackerPanel() {
        fetch('/players/tracked')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                trackedPlayers = data;
                document.getElementById('tracker-count-badge').textContent = trackedPlayers.length;

                var body = document.getElementById('tracker-list-body');
                if (trackedPlayers.length === 0) {
                    body.innerHTML = '<div id="tracker-empty">No players being tracked.<br/>Search for a name and click <strong>Track</strong>.</div>';
                    return;
                }

                body.innerHTML = '';
                trackedPlayers.forEach(function(tp) { body.appendChild(trackerItem(tp)); });
            })
            .catch(function() {});
    }

    // =====================================================================
    // PATH DRAWING
    // =====================================================================
    var pathLayers = {};
    var selectedPathUUID = null;
    var allPathPoints = [];
    var pathMinTs = 0, pathMaxTs = 0;
    var pathGroup = L.layerGroup().addTo(map);

    function selectPath(uuid, username) {
        selectedPathUUID = uuid;
        drawPath(uuid);
        refreshTrackerPanel();

        document.getElementById('path-slider-panel').style.display = 'block';
        document.getElementById('path-player-avatar').src = headUrl(username, 32);
        document.getElementById('path-player-name').textContent = username;
    }

    // Clears the start/end markers but keeps the other players' paths
    function resetPathGroup() {
        pathGroup.clearLayers();
        Object.keys(pathLayers).forEach(function(uid) {
            if (uid !== selectedPathUUID) pathLayers[uid].addTo(pathGroup);
        });
    }

    function drawPath(uuid) {
        fetch('/players/path?uuid=' + encodeURIComponent(uuid))
            .then(function(r) { return r.json(); })
            .then(function(data) {
                allPathPoints = Array.isArray(data) ? data : [];
                resetPathGroup();
                if (!allPathPoints.length) {
                    document.getElementById('path-point-count').textContent = '(no data yet)';
                    return;
                }
                pathMinTs = allPathPoints[0].timestamp;
                pathMaxTs = allPathPoints[allPathPoints.length-1].timestamp;
                document.getElementById('range-start').value = 0;
                document.getElementById('range-end').value   = 100;
                renderPathForRange(0, 100);
            })
            .catch(function() {});
    }

    function renderPathForRange(startPct, endPct) {
        if (!allPathPoints.length) return;

        var n = allPathPoints.length;
        var si = Math.floor(startPct / 100 * (n - 1));
        var ei = Math.min(n - 1, Math.ceil(endPct / 100 * (n - 1)));
        var slice = allPathPoints.slice(si, ei + 1);

        function fmtTs(ts) { return new Date(ts * 1000).toLocaleString(); }
        document.getElementById('range-start-label').textContent = slice.length ? fmtTs(slice[0].timestamp) : '—';
        document.getElementById('range-end-label').textContent   = slice.length ? fmtTs(slice[slice.length-1].timestamp) : '—';
        document.getElementById('path-point-count').textContent  = slice.length + ' pts';
        document.getElementById('stat-visible').textContent      = slice.length;

        // Points without coordinates (offline / hidden) are skipped, not treated as 0,0
        var latlngs = [];
        slice.forEach(function(p) {
            if (p.x !== null && p.z !== null) latlngs.push([p.z, p.x]);
        });

        var dist = 0;
        for (var i = 1; i < latlngs.length; i++) {
            var dx = latlngs[i][1] - latlngs[i-1][1];
            var dz = latlngs[i][0] - latlngs[i-1][0];
            dist += Math.sqrt(dx*dx + dz*dz);
        }
        document.getElementById('stat-distance').textContent = Math.round(dist).toLocaleString();

        if (slice.length >= 2) {
            var secs = slice[slice.length-1].timestamp - slice[0].timestamp;
            var h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = secs%60;
            document.getElementById('stat-duration').textContent =
                h ? (h + 'h ' + m + 'm') : m ? (m + 'm ' + s + 's') : (s + 's');
        } else {
            document.getElementById('stat-duration').textContent = '—';
        }

        var colour = getColour(selectedPathUUID);

        // Remove old polyline for this player
        if (pathLayers[selectedPathUUID]) pathLayers[selectedPathUUID].remove();

        if (latlngs.length >= 2) {
            var poly = L.polyline(latlngs, {
                color: colour, weight: 3, opacity: 0.85,
                smoothFactor: 1, lineJoin: 'round'
            });
            poly.addTo(pathGroup);
            pathLayers[selectedPathUUID] = poly;

            // Start/end markers
            var mkIcon = function(c) {
                return L.divIcon({
                    className: '',
                    html: '<div style="background:' + c + ';width:10px;height:10px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px ' + c + ';"></div>',
                    iconSize: [10,10], iconAnchor: [5,5]
                });
            };
            L.marker(latlngs[0], {icon: mkIcon('#22c55e'), zIndexOffset: 900})
             .bindTooltip('Start', {permanent: false, direction: 'top'}).addTo(pathGroup);
            L.marker(latlngs[latlngs.length-1], {icon: mkIcon(colour), zIndexOffset: 900})
             .bindTooltip('End', {permanent: false, direction: 'top'}).addTo(pathGroup);
        }

        updateSliderFill(
            parseInt(document.getElementById('range-start').value),
            parseInt(document.getElementById('range-end').value)
        );
    }

    function updateSliderFill(startPct, endPct) {
        var fill = document.getElementById('slider-fill');
        fill.style.left  = startPct + '%';
        fill.style.width = (endPct - startPct) + '%';
    }

    function closePathPanel() {
        document.getElementById('path-slider-panel').style.display = 'none';
        if (pathLayers[selectedPathUUID]) {
            pathLayers[selectedPathUUID].remove();
            delete pathLayers[selectedPathUUID];
        }
        selectedPathUUID = null;
        allPathPoints = [];
        pathGroup.clearLayers();
        refreshTrackerPanel();
    }

    // Dual range slider events
    (function() {
        var startEl = document.getElementById('range-start');
        var endEl   = document.getElementById('range-end');

        function onSliderChange() {
            var s = parseInt(startEl.value);
            var e = parseInt(endEl.value);
            if (s > e) { var tmp = s; s = e; e = tmp; }
            resetPathGroup();
            renderPathForRange(s, e);
            updateSliderFill(s, e);
        }

        startEl.addEventListener('input', onSliderChange);
        endEl.addEventListener('input', onSliderChange);
    })();

    // =====================================================================
    // AUTOCOMPLETE
    // =====================================================================
    var usernameInput    = document.getElementById('username-input');
    var autocompleteList = document.getElementById('autocomplete-list');

    usernameInput.addEventListener('input', function() {
        var val = this.value.toLowerCase().trim();
        autocompleteList.innerHTML = '';
        if (!val) { autocompleteList.style.display = 'none'; return; }

        var matches = window.livePlayers.filter(function(p) {
            return p.name && p.name.toLowerCase().includes(val);
        });
        if (!matches.length) { autocompleteList.style.display = 'none'; return; }

        autocompleteList.style.display = 'block';
        matches.slice(0, 10).forEach(function(m) {
            var d = document.createElement('div');
            d.className = 'autocomplete-item';
            d.innerHTML = '<img src="' + headUrl(m.name, 20) + '" alt="" /><span>' + escapeHtml(m.name) + '</span>';
            d.onclick = function() {
                usernameInput.value = m.name;
                autocompleteList.style.display = 'none';
                searchPlayer();
            };
            autocompleteList.appendChild(d);
        });
    });

    document.addEventListener('click', function(e) {
        if (e.target !== usernameInput && !autocompleteList.contains(e.target))
            autocompleteList.style.display = 'none';
    });

    document.getElementById("auto-track-toggle").addEventListener("change", function() {
        if (this.checked) {
            var u = usernameInput.value.trim();
            if (u) startAutoTrack(u);
            else { this.checked = false; showWarning("Type a player name first, then enable Follow."); }
        } else stopAutoTrack();
    });

    // Start the live refresh loop once everything above is defined
    updatePlayers();
    </script>
</body>
</html>
